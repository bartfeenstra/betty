name: Test

permissions: {}

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
  pull_request:
  push:
    branches:
      - '[0-9].[0-9].x'
    tags:
      - '*'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # The number of builds that submit code coverage configured here MUST be identical
          # to the number of `after_n_builds` in ./codecov.yml.
          - name: 'Python 3.15 (Linux)'
            os: ubuntu-latest
            poppler: true
            python: '3.15'
            nodejs: null
            install: python ./bin/install.py --no-npm --no-playwright
            test: betty dev-test-pytest -- -n auto -m 'not playwright and not webpack'
            coverage: true
          - name: 'Python 3.14 (Linux)'
            os: ubuntu-latest
            poppler: true
            python: '3.14'
            nodejs: null
            install: python ./bin/install.py --no-npm --no-playwright
            test: betty dev-test-pytest -- -n auto -m 'not playwright and not webpack'
            coverage: true
          - name: 'Python 3.13 (Linux)'
            os: ubuntu-latest
            poppler: true
            python: '3.13'
            install: python ./bin/install.py --no-npm --no-playwright
            test: betty dev-test-pytest -- -n auto -m 'not playwright and not webpack'
            coverage: true
          - name: 'Python 3.15 (macOS)'
            os: macos-latest
            poppler: true
            python: '3.15'
            install: python ./bin/install.py --no-npm --no-playwright
            test: betty dev-test-pytest -- -n auto -m 'not playwright and not webpack'
            coverage: true
          - name: 'Python 3.15 (Windows)'
            os: windows-latest
            poppler: true
            python: '3.15'
            nodejs: null
            install: python ./bin/install.py --no-npm --no-playwright
            test: betty dev-test-pytest -- -n auto -m 'not playwright and not webpack'
            coverage: true
          - name: 'Static tests'
            os: ubuntu-latest
            poppler: false
            python: '3.15'
            nodejs: 26.x
            install: python ./bin/install.py --no-playwright
            test: |
              betty dev-test-ruff
              betty dev-test-ty
              betty dev-test-slotscheck
              betty dev-test-stylelint
              betty dev-test-tsc
              betty dev-test-eslint
          - name: 'JavaScript & Playwright'
            os: ubuntu-latest
            poppler: false
            python: '3.15'
            nodejs: 26.x
            install: python ./bin/install.py
            test: betty dev-test-pytest -- -n auto -m 'playwright or webpack'
            coverage: true
          - name: 'Package build'
            os: ubuntu-latest
            poppler: false
            python: '3.15'
            nodejs: null
            install: python ./bin/install.py --no-npm --no-playwright
            test: betty dev-test-build-package
            coverage: false
    timeout-minutes: 60
    steps:
      - name: Check out the source code
        uses: actions/checkout@v7

      - name: Get the pip cache directory
        run: echo "pip_cache_dir=$(pip cache dir)" >> $GITHUB_ENV
        shell: bash

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ${{ env.pip_cache_dir }}
          key: pip-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('./pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python }}-

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Get the npm cache directory
        if: ${{ matrix.nodejs }}
        run: echo "npm_cache_dir=$(npm config get cache)" >> $GITHUB_ENV
        shell: bash

      - name: Cache npm
        if: ${{ matrix.nodejs }}
        uses: actions/cache@v6
        with:
          path: ${{ env.npm_cache_dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('./package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Set up Node.js
        if: ${{ matrix.nodejs }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.nodejs }}

      - name: Install Poppler (APT)
        if: ${{ matrix.poppler && startsWith(runner.os, 'Linux') }}
        run: |
          sudo apt-get update
          sudo apt-get install  poppler-utils

      - name: Install Poppler (Brew)
        if: ${{ matrix.poppler && startsWith(runner.os, 'macOS') }}
        run: brew install poppler

      - name: Install Poppler (Scoop)
        if: ${{ matrix.poppler && startsWith(runner.os, 'Windows') }}
        uses: MinoruSekine/setup-scoop@v5
        with:
          apps: poppler

      - name: Install Betty
        run: ${{ matrix.install }}

      - name: Run the tests
        run: ${{ matrix.test }}

      - name: Upload code coverage
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
