[pytest]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
asyncio_mode = "auto"
testpaths = [
    "betty/tests",
]
addopts = [
    "--browser",
    "chromium",
    "--browser",
    "firefox",
]
markers = [
    "duration(duration): set the test's estimated duration",
    "playwright(): mark a test as using Playwright",
    "sphinx(): mark a test as using Sphinx",
    "webpack(): mark a test as using Webpack",
]