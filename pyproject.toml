[build-system]
requires = [
    'setuptools ~= 84.0',
]
build-backend = 'setuptools.build_meta'

[project]
version = '0.0.0'
name = 'betty'
description = 'Betty visualizes and publishes your family history by building interactive, encyclopedia-like genealogy websites out of your Gramps and GEDCOM family trees'
readme = 'README.md'
license = 'GPL-3.0-or-later'
license-files = ['LICENSE.txt']
authors = [
  {name = 'Bart Feenstra', email = 'bar@bartfeenstra.com'},
]
requires-python = '~= 3.13'
dependencies = [
    # aiohttp-client-cache's file backend requires aiofiles.
    'aiofiles ~= 25.1',
    'aiohttp[speedups] ~= 3.14',
    'aiohttp-client-cache ~= 0.15.0',
    'aiosqlite ~= 0.22.0',
    'babel ~= 2.16',
    'docutils ~= 0.21',
    'geopy ~= 2.4',
    'jinja2 ~= 3.1',
    'lxml ~= 7.0.0b1',
    'markupsafe ~= 3.0',
    'pdf2image ~= 1.17',
    'polib ~= 1.2',
    'Pillow ~= 13.0',
    'platformdirs ~= 4.3',
    'pyyaml ~= 6.0',
    'rich ~= 15.0',
    'rich-argparse ~= 1.7',
    'shibuya == 2026.7.12',
    'sphinx ~= 8.2',
    'sphinx-design ~= 0.7.0',
    'ty-extensions == 0.4.0',
    'typing_extensions ~= 4.16',
    'winuvloop ~= 0.2.5',
]
classifiers = [
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Intended Audience :: End Users/Desktop',
    'Intended Audience :: Science/Research',
    'Programming Language :: JavaScript',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: POSIX :: Linux',
    'Operating System :: Microsoft :: Windows',
    'Topic :: Internet',
    'Topic :: Scientific/Engineering :: Visualization',
    'Topic :: Sociology :: Genealogy',
    'Topic :: Sociology :: History',
    'Topic :: Software Development :: Code Generators',
    'Natural Language :: Arabic',
    'Natural Language :: Dutch',
    'Natural Language :: English',
    'Natural Language :: Finnish',
    'Natural Language :: French',
    'Natural Language :: German',
    'Natural Language :: Hebrew',
    'Natural Language :: Portuguese (Brazilian)',
    'Natural Language :: Russian',
    'Natural Language :: Spanish',
    'Natural Language :: Ukrainian',
    'Typing :: Typed',
]

[project.urls]
Documentation = 'https://betty.readthedocs.io'
GitHub = 'https://github.com/bartfeenstra/betty'

[project.entry-points.'console_scripts']
betty = 'betty.consoles.app:main'

[project.entry-points.'betty.plugin']
'asset-directory' = 'betty.asset:AssetDirectoryDefinition'
'command' = 'betty.console:CommandDefinition'
'content-builder' = 'betty.content_builder:ContentBuilderDefinition'
'copyright-notice' = 'betty.copyright_notice:CopyrightNoticeDefinition'
'css-resource' = 'betty.html.css:CssResourceDefinition'
'document-provider' = 'betty.document:DocumentProviderDefinition'
'enricher' = 'betty.load:EnricherDefinition'
'entity' = 'betty.entity:EntityDefinition'
'event-type' = 'betty.event_type:EventTypeDefinition'
'gender' = 'betty.gender:GenderDefinition'
'http-rate-limit' = 'betty.http_client:RateLimitDefinition'
'jinja-filter' = 'betty.jinja.filter:JinjaFilterDefinition'
'jinja-test' = 'betty.jinja.test:JinjaTestDefinition'
'js-resource' = 'betty.html.js:JsResourceDefinition'
'license' = 'betty.license:LicenseDefinition'
'link' = 'betty.link:LinkDefinition'
'loader' = 'betty.load:LoaderDefinition'
'media-type' = 'betty.media_type:MediaTypeDefinition'
'place-type' = 'betty.place_type:PlaceTypeDefinition'
'renderer' = 'betty.render:RendererDefinition'
'role' = 'betty.role:RoleDefinition'
'serializer' = 'betty.serialize:SerializerDefinition'
'server' = 'betty.server:ServerDefinition'
'service-provider' = 'betty.service_provider:ServiceProviderDefinition'

[project.entry-points.'betty.asset_directory']
'implicit' = 'betty.asset_directories'
'project' = 'betty.project._plugin_discovery:_discover_asset_directories'

[project.entry-points.'betty.command']
'implicit' = 'betty.commands'

[project.entry-points.'betty.content_builder']
'implicit' = 'betty.content_builders'

[project.entry-points.'betty.copyright_notice']
'implicit' = 'betty.copyright_notices'
'project' = 'betty.project._plugin_discovery:_discover_copyright_notices'

[project.entry-points.'betty.css_resource']
'implicit' = 'betty.css_resources'

[project.entry-points.'betty.document_provider']
'implicit' = 'betty.document_providers'

[project.entry-points.'betty.enricher']
'implicit' = 'betty.enrichers'

[project.entry-points.'betty.entity']
'implicit' = 'betty.entities'

[project.entry-points.'betty.event_type']
'implicit' = 'betty.event_types'
'project' = 'betty.project._plugin_discovery:_discover_event_types'

[project.entry-points.'betty.gender']
'implicit' = 'betty.genders'
'project' = 'betty.project._plugin_discovery:_discover_genders'

[project.entry-points.'betty.http_rate_limit']
'implicit' = 'betty.http_rate_limits'

[project.entry-points.'betty.jinja_filter']
'implicit' = 'betty.jinja_filters'

[project.entry-points.'betty.jinja_test']
'implicit' = 'betty.jinja_tests'

[project.entry-points.'betty.js_resource']
'implicit' = 'betty.js_resources'

[project.entry-points.'betty.license']
'implicit' = 'betty.licenses'
'project' = 'betty.project._plugin_discovery:_discover_licenses'
'spdx' = 'betty.licenses.spdx:SpdxLicenseDiscoverer.discover_for'

[project.entry-points.'betty.link']
'implicit' = 'betty.links'

[project.entry-points.'betty.loader']
'implicit' = 'betty.loaders'

[project.entry-points.'betty.media_type']
'implicit' = 'betty.media_types'

[project.entry-points.'betty.place_type']
'implicit' = 'betty.place_types'
'project' = 'betty.project._plugin_discovery:_discover_place_types'

[project.entry-points.'betty.renderer']
'implicit' = 'betty.renderers'

[project.entry-points.'betty.role']
'implicit' = 'betty.roles'
'project' = 'betty.project._plugin_discovery:_discover_roles'

[project.entry-points.'betty.serializer']
'implicit' = 'betty.serializers'

[project.entry-points.'betty.server']
'implicit' = 'betty.servers'

[project.entry-points.'betty.service_provider']
'implicit' = 'betty.service_providers'

[project.optional-dependencies]
dev = [
    'aiohttp ~= 3.12',
    'aioresponses ~= 0.7.8',
    'build ~= 1.3',
    'coverage ~= 7.6',
    'packaging ~= 26.0',
    'puremagic ~= 2.0',
    'pytest ~= 9.0',
    'pytest-aioresponses ~= 0.3.0',
    'pytest-asyncio ~= 1.0',
    'pytest-mock ~= 3.14',
    'pytest-order ~= 1.3',
    'pytest-playwright-asyncio ~= 0.10.0',
    'pytest-timeout ~= 2.4.0',
    'pytest-xdist ~= 3.8',
    'requests ~= 2.32',
    'ruff ~= 0.17.0',
    'slotscheck ~= 0.21',
    'twine ~= 7.0',
    'ty == 0.0.95',
    'types-babel ~= 2.11',
    'types-docutils ~= 0.21',
    'types-lxml >= 2024.9.16',
    'types-polib ~= 1.2',
    'types-pyyaml ~= 6.0',
    'types-requests ~= 2.32',
    'types-setuptools ~= 84.0',
    'virtualenv ~= 21.1',
    'yappi ~= 1.7',
    'yarl ~= 1.22',
]

[tool.setuptools.packages.find]
where = ['.']
include = [
    'betty',
    'betty.*',
]
exclude = [
    'betty.tests',
    'betty.tests.*',
]

[tool.setuptools.package-data]
betty = [
    'py.typed',

    # Data.
    '../data/**/*',
    '../data/asset/builtin/public/localized/.error/*',

    # Webpack.
    '../.browserslistrc',
    '../tsconfig.json',
]

[tool.setuptools.exclude-package-data]
betty = [
    '__pycache__',
]
