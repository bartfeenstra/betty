[build-system]
requires = [
    'setuptools ~= 82.0',
]
build-backend = 'setuptools.build_meta'

[project]
version = '0.0.0'
name = 'betty'
description = 'Betty visualizes and publishes your family history by building interactive, encyclopedia-like genealogy websites out of your Gramps and GEDCOM family trees'
readme = 'README.md'
license = 'GPL-3.0-or-later'
license-files = ['LICENSE.txt']
authors = [
  {name = 'Bart Feenstra', email = 'bar@bartfeenstra.com'},
]
requires-python = '~= 3.13'
dependencies = [
    # aiohttp-client-cache's file backend requires aiofiles.
    'aiofiles ~= 25.1',
    'aiohttp ~= 3.12',
    'aiohttp-client-cache ~= 0.14',
    'aiosqlite ~= 0.21',
    'babel ~= 2.16',
    'docutils ~= 0.21',
    'geopy ~= 2.4',
    'jinja2 ~= 3.1',
    'jsonschema ~= 4.23',
    'lxml ~= 6.0',
    'markupsafe ~= 3.0',
    'pdf2image ~= 1.17',
    'polib ~= 1.2',
    'Pillow ~= 12.0',
    'platformdirs ~= 4.3',
    'pyyaml ~= 6.0',
    'referencing ~= 0.37.0',
    'rich ~= 15.0',
    'rich-argparse ~= 1.7',
    'shibuya == 2026.5.19',
    'sphinx ~= 8.2',
    'sphinx-design ~= 0.7.0',
]
classifiers = [
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Intended Audience :: End Users/Desktop',
    'Intended Audience :: Science/Research',
    'Programming Language :: JavaScript',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: POSIX :: Linux',
    'Operating System :: Microsoft :: Windows',
    'Topic :: Internet',
    'Topic :: Scientific/Engineering :: Visualization',
    'Topic :: Sociology :: Genealogy',
    'Topic :: Sociology :: History',
    'Topic :: Software Development :: Code Generators',
    'Natural Language :: Arabic',
    'Natural Language :: Dutch',
    'Natural Language :: English',
    'Natural Language :: Finnish',
    'Natural Language :: French',
    'Natural Language :: German',
    'Natural Language :: Hebrew',
    'Natural Language :: Portuguese (Brazilian)',
    'Natural Language :: Russian',
    'Natural Language :: Spanish',
    'Natural Language :: Ukrainian',
    'Typing :: Typed',
]

[project.urls]
Documentation = 'https://betty.readthedocs.io'
GitHub = 'https://github.com/bartfeenstra/betty'

[project.entry-points.'console_scripts']
betty = 'betty.console:main_standalone'

[project.entry-points.'betty.plugin']
'asset-directory' = 'betty.asset:AssetDirectoryDefinition'
'command' = 'betty.console.command:CommandDefinition'
'content' = 'betty.content:ContentDefinition'
'copyright-notice' = 'betty.copyright_notice:CopyrightNoticeDefinition'
'css-resource' = 'betty.html.css:CssResourceDefinition'
'document-provider' = 'betty.document:DocumentProviderDefinition'
