[project.optional-dependencies]
setuptools = [
    'build ~= 1.3',
    'twine ~= 6.0',
    'wheel ~= 0.47.0',
]
test = [
    # Work around https://github.com/pnuckowski/aioresponses/issues/289.
    'aiohttp ~= 3.12, < 3.14',
    'aioresponses ~= 0.7.8',
    'coverage ~= 7.6',
    'packaging ~= 26.0',
    'puremagic ~= 2.0',
    'pytest ~= 9.0',
    'pytest-aioresponses ~= 0.3.0',
    'pytest-asyncio ~= 1.0',
    'pytest-mock ~= 3.14',
    'pytest-order ~= 1.3',
    'pytest-playwright-asyncio ~= 0.8.0',
    'pytest-xdist ~= 3.8',
    'requests ~= 2.32',
    'ruff ~= 0.15.0',
    'ty == 0.0.34',
    'types-babel ~= 2.11',
    'types-docutils ~= 0.21',
    'types-jsonschema ~= 4.23',
    'types-lxml >= 2024.9.16',
    'types-polib ~= 1.2',
    'types-pyyaml ~= 6.0',
    'types-requests ~= 2.32',
    'types-setuptools ~= 82.0',
    'virtualenv ~= 21.1',
    'yappi ~= 1.7',
    'yarl ~= 1.22',
    'betty[setuptools]',
]
development = [
    'pytest-repeat ~= 0.9.4',
    'betty[test]',
]
ci = [
    'codecov ~= 2.1',
    'betty[test]',
]

[tool.setuptools.packages.find]
where = ['.']
include = [
    'betty',
    'betty.*',
]
exclude = [
    'betty.tests',
    'betty.tests.*',
]

[tool.setuptools.package-data]
betty = [
    'py.typed',

    # Data.
    '../data/**/*',
    '../data/asset/builtin/public/localized/.error/*',

    # Webpack.
    '../.browserslistrc',
    '../tsconfig.json',
]

[tool.setuptools.exclude-package-data]
betty = [
    '__pycache__',
]
